openapi: 3.0.3
info:
  title: "[NOME_DO_PROJETO] API"
  description: |
    API RESTful para [DESCRIÇÃO_DO_PROJETO].
    
    ## Autenticação
    [DESCREVER_MÉTODO_DE_AUTENTICAÇÃO]
    
    ## Segurança
    - [MEDIDA_DE_SEGURANÇA_1]
    - [MEDIDA_DE_SEGURANÇA_2]
    - [MEDIDA_DE_SEGURANÇA_3]
    
    ## Funcionalidades Principais
    - [FUNCIONALIDADE_1]
    - [FUNCIONALIDADE_2]
    - [FUNCIONALIDADE_3]
  version: "[VERSÃO_DA_API]"
  contact:
    name: "[NOME_DO_SUPORTE]"
    email: "[EMAIL_DO_SUPORTE]"
  license:
    name: "[TIPO_DE_LICENÇA]"
servers:
  - url: "[URL_PRODUÇÃO]"
    description: Servidor de Produção
  - url: "[URL_STAGING]"
    description: Servidor de Staging
  - url: "[URL_DESENVOLVIMENTO]"
    description: Servidor de Desenvolvimento

security:
  - BearerAuth: []

paths:
  # ==========================================
  # AUTENTICAÇÃO E PERFIL
  # ==========================================
  
  /auth/register:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      description: |
        [DESCRIÇÃO_DO_ENDPOINT_DE_REGISTRO]
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Email do usuário
                password:
                  type: string
                  minLength: 8
                  description: Senha do usuário
                [CAMPO_ADICIONAL_1]:
                  type: string
                  description: "[DESCRIÇÃO_DO_CAMPO]"
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Fazer login
      description: |
        [DESCRIÇÃO_DO_ENDPOINT_DE_LOGIN]
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # [SEÇÃO_DE_ENDPOINTS_PERSONALIZADOS]
  # ==========================================
  
  /[RECURSO_PRINCIPAL]:
    get:
      tags:
        - "[NOME_DA_TAG]"
      summary: "[RESUMO_DO_ENDPOINT]"
      description: |
        [DESCRIÇÃO_DETALHADA_DO_ENDPOINT]
      operationId: "[NOME_DA_OPERAÇÃO]"
      parameters:
        - name: page
          in: query
          description: Número da página
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Itens por página
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/[SCHEMA_DO_RECURSO]'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - "[NOME_DA_TAG]"
      summary: "Criar [NOME_DO_RECURSO]"
      description: |
        [DESCRIÇÃO_DA_CRIAÇÃO_DO_RECURSO]
      operationId: "create[NOME_DO_RECURSO]"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/[SCHEMA_DE_CRIAÇÃO]'
      responses:
        '201':
          description: "[RECURSO] criado com sucesso"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/[SCHEMA_DO_RECURSO]'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT fornecido pelo sistema de autenticação

  schemas:
    # ==========================================
    # SCHEMAS DE AUTENTICAÇÃO
    # ==========================================
    
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único do usuário
        email:
          type: string
          format: email
          description: Email do usuário
        [CAMPO_PERSONALIZADO_1]:
          type: string
          description: "[DESCRIÇÃO_DO_CAMPO]"
        created_at:
          type: string
          format: date-time
          description: Data de criação
        updated_at:
          type: string
          format: date-time
          description: Data da última atualização

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Token de acesso JWT
        refresh_token:
          type: string
          description: Token de renovação
        expires_in:
          type: integer
          description: Tempo de expiração em segundos
        user:
          $ref: '#/components/schemas/UserResponse'

    # ==========================================
    # SCHEMAS DE RECURSOS PERSONALIZADOS
    # ==========================================
    
    [SCHEMA_DO_RECURSO]:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único do recurso
        [PROPRIEDADE_1]:
          type: string
          description: "[DESCRIÇÃO_DA_PROPRIEDADE]"
        [PROPRIEDADE_2]:
          type: integer
          description: "[DESCRIÇÃO_DA_PROPRIEDADE]"
        [PROPRIEDADE_3]:
          type: boolean
          description: "[DESCRIÇÃO_DA_PROPRIEDADE]"
        created_at:
          type: string
          format: date-time
          description: Data de criação
        updated_at:
          type: string
          format: date-time
          description: Data da última atualização

    [SCHEMA_DE_CRIAÇÃO]:
      type: object
      required:
        - "[CAMPO_OBRIGATÓRIO_1]"
        - "[CAMPO_OBRIGATÓRIO_2]"
      properties:
        [CAMPO_OBRIGATÓRIO_1]:
          type: string
          description: "[DESCRIÇÃO_DO_CAMPO]"
        [CAMPO_OBRIGATÓRIO_2]:
          type: string
          description: "[DESCRIÇÃO_DO_CAMPO]"
        [CAMPO_OPCIONAL]:
          type: string
          description: "[DESCRIÇÃO_DO_CAMPO]"

    # ==========================================
    # SCHEMAS DE RESPOSTA PADRÃO
    # ==========================================
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Código do erro
            message:
              type: string
              description: Mensagem de erro
            details:
              type: array
              items:
                type: string
              description: Detalhes adicionais do erro

    PaginationResponse:
      type: object
      properties:
        page:
          type: integer
          description: Página atual
        limit:
          type: integer
          description: Itens por página
        total:
          type: integer
          description: Total de itens
        total_pages:
          type: integer
          description: Total de páginas
        has_next:
          type: boolean
          description: Indica se há próxima página
        has_prev:
          type: boolean
          description: Indica se há página anterior

  responses:
    # ==========================================
    # RESPOSTAS DE ERRO PADRÃO
    # ==========================================
    
    BadRequestError:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "BAD_REQUEST"
              message: "Dados da requisição são inválidos"
              details: ["Campo 'email' é obrigatório"]

    UnauthorizedError:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Token de acesso inválido ou expirado"
              details: []

    ForbiddenError:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "FORBIDDEN"
              message: "Usuário não tem permissão para acessar este recurso"
              details: []

    NotFoundError:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "NOT_FOUND"
              message: "Recurso solicitado não foi encontrado"
              details: []

    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: "INTERNAL_SERVER_ERROR"
              message: "Erro interno do servidor"
              details: []

  parameters:
    # ==========================================
    # PARÂMETROS REUTILIZÁVEIS
    # ==========================================
    
    PageParam:
      name: page
      in: query
      description: Número da página para paginação
      schema:
        type: integer
        default: 1
        minimum: 1

    LimitParam:
      name: limit
      in: query
      description: Número de itens por página
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    IdParam:
      name: id
      in: path
      required: true
      description: ID único do recurso
      schema:
        type: string
        format: uuid

tags:
  - name: Autenticação
    description: Endpoints relacionados à autenticação e autorização
  - name: "[NOME_DA_TAG_PERSONALIZADA]"
    description: "[DESCRIÇÃO_DA_TAG_PERSONALIZADA]"